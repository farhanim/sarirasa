<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F5">
<title>Sari Rasa Control Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* ============ Design tokens · lihat STYLE-GUIDE.md ============ */
:root{
  /* Neutrals (Midnight Velvet, Moonlit Gray, Ivory Lace) */
  --ink:#01040C;--bg:#F5F5F5;--card:#FFFFFF;--raised:#F7F8FA;
  --line:#ECECEE;--line-2:#E1E2E6;
  --text:#01040C;--text-2:#4F5562;--text-3:#626875;
  /* Azure Dream */
  --accent:#2463EB;--accent-2:#609FFF;--accent-ink:#1A4FC9;--accent-soft:#EEF4FF;--accent-line:#D7E5FF;
  /* Status */
  --ok:#2FB86E;--ok-soft:#EAF8F0;--ok-ink:#15803D;
  --warn:#F07B3F;--warn-soft:#FEF1E9;--warn-ink:#B4471A;
  --crit:#EF4444;--crit-soft:#FDEDED;--crit-ink:#B42318;
  --prog:#7C5CFC;--prog-soft:#F2EFFF;--prog-ink:#5B3FD9;
  /* Type scale: 6 ukuran saja */
  --fs-cap:12px;--lh-cap:16px;--fs-sm:13px;--lh-sm:18px;--fs-body:15px;--lh-body:22px;
  --fs-title:16px;--lh-title:24px;--fs-h:20px;--lh-h:28px;--fs-fig:28px;--lh-fig:34px;
  --sh-1:0 1px 2px rgba(1,4,12,.04);
  --sh-2:0 1px 2px rgba(1,4,12,.04),0 6px 16px rgba(1,4,12,.04);
  --sh-3:0 24px 48px rgba(1,4,12,.14),0 2px 6px rgba(1,4,12,.06);
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:96px}
body{font-family:'Inter Tight',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:var(--fs-body);line-height:var(--lh-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;min-height:100dvh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
a{color:inherit}
b,.fig,.num{font-variant-numeric:tabular-nums}
b{font-weight:600}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i-sm{width:16px;height:16px}svg.i-xs{width:14px;height:14px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:0 32px}
.t-cap{font-size:var(--fs-cap);line-height:var(--lh-cap)}
.t-sm{font-size:var(--fs-sm);line-height:var(--lh-sm)}

/* ============ Buttons ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:10px;font-size:var(--fs-body);font-weight:500;white-space:nowrap;text-decoration:none;transition:background-color .15s var(--ease),box-shadow .15s,scale .15s ease-out,opacity .15s}
.btn:not(:disabled):active{scale:.96}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-p{background:linear-gradient(180deg,#3573F0 0%,var(--accent) 100%);color:#fff;box-shadow:inset 0 0 0 1px rgba(1,4,12,.08),inset 0 1px 0 rgba(255,255,255,.22),0 1px 2px rgba(36,99,235,.3)}
.btn-s{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--line-2),var(--sh-1)}
.btn-g{color:var(--text-2)}
.btn-sm{height:32px;padding:0 12px;border-radius:8px;font-size:var(--fs-sm);gap:6px}
.btn-block{width:100%}
@media (hover:hover){.btn-p:hover{background:var(--accent)}.btn-s:hover,.btn-g:hover{background:var(--raised)}}
.icon-btn{width:40px;height:40px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2),var(--sh-1);display:grid;place-items:center;color:var(--text-2);flex:none;transition:background-color .15s,scale .15s ease-out}
.icon-btn:active{scale:.94}
@media (hover:hover){.icon-btn:hover{background:var(--raised);color:var(--text)}}
.icon-btn.spinning svg{animation:rot .8s linear infinite}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;display:inline-block;flex:none}
.link{color:var(--accent);font-weight:500;font-size:var(--fs-sm);display:inline-flex;align-items:center;gap:4px;text-decoration:none}

/* ============ Icon tile (signature dari referensi) ============ */
.itile{width:32px;height:32px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px var(--accent-line)}
.itile.ok{background:var(--ok-soft);color:var(--ok-ink);box-shadow:inset 0 0 0 1px rgba(47,184,110,.22)}
.itile.warn{background:var(--warn-soft);color:var(--warn-ink);box-shadow:inset 0 0 0 1px rgba(240,123,63,.22)}
.itile.crit{background:var(--crit-soft);color:var(--crit-ink);box-shadow:inset 0 0 0 1px rgba(239,68,68,.2)}
.itile.lg{width:40px;height:40px;border-radius:11px}
.itile.face{background:var(--accent-soft);overflow:hidden;align-items:end}

/* ============ Tags & delta ============ */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-cap);line-height:var(--lh-cap);font-weight:500;padding:3px 8px;border-radius:6px;white-space:nowrap}
.t-ok{background:var(--ok-soft);color:var(--ok-ink)}.t-warn{background:var(--warn-soft);color:var(--warn-ink)}
.t-crit{background:var(--crit-soft);color:var(--crit-ink)}.t-info{background:var(--prog-soft);color:var(--prog-ink)}
.t-n{background:var(--raised);color:var(--text-2);box-shadow:inset 0 0 0 1px var(--line)}
.delta{display:inline-flex;align-items:center;gap:3px;font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;white-space:nowrap}
.delta .vs{color:var(--text-3);font-weight:400;margin-left:2px}
.d-ok{color:var(--ok-ink)}.d-warn{color:var(--warn-ink)}.d-crit{color:var(--crit-ink)}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--crit);flex:none;animation:pulse 1.8s infinite}

/* ============ Top bar ============ */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-top:24px;padding-bottom:20px}
.top-l{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;background:var(--ink);color:#fff;font-weight:600;font-size:var(--fs-sm);display:grid;place-items:center;flex:none}
.top h1{font-size:var(--fs-h);line-height:var(--lh-h);font-weight:500;letter-spacing:-.01em}
.top .sub{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2)}
.top-r{display:flex;gap:8px;align-items:center}
.pill-meta{height:40px;padding:0 12px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2);display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);color:var(--text-2);white-space:nowrap}
.pill-meta.warn{color:var(--warn-ink);background:var(--warn-soft);box-shadow:inset 0 0 0 1px rgba(240,123,63,.3)}

/* ============ Card ============ */
.card{background:var(--card);border-radius:16px;border:1px solid var(--line);box-shadow:var(--sh-2);min-width:0}
.card-h{display:flex;align-items:center;gap:10px;padding:16px}
.ch-t{flex:1;min-width:0}
.card-h h2{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:500;display:flex;align-items:center;gap:8px}
.card-h p{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2)}
.count{font-size:var(--fs-cap);font-weight:600;min-width:22px;height:22px;padding:0 7px;border-radius:6px;display:inline-grid;place-items:center;background:var(--crit-soft);color:var(--crit-ink)}
.count.zero{background:var(--ok-soft);color:var(--ok-ink)}
.info-btn{width:32px;height:32px;border-radius:8px;display:inline-grid;place-items:center;color:var(--text-3);flex:none}
@media (hover:hover){.info-btn:hover{background:var(--raised);color:var(--text)}}

/* ============ Status card ============ */
.status{display:grid;grid-template-columns:auto minmax(0,1fr) 260px;gap:12px 24px;align-items:center;padding:16px 20px}
.st-main{display:flex;align-items:center;gap:12px}
.st-l{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2)}
.st-t{font-size:var(--fs-h);line-height:var(--lh-h);font-weight:600}
.s-ok .st-t{color:var(--ok-ink)}.s-warn .st-t{color:var(--warn-ink)}.s-crit .st-t{color:var(--crit-ink)}
.st-text{color:var(--text-2);border-left:1px solid var(--line);padding-left:24px}
.st-text b{color:var(--text);font-weight:500}
.scale{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.scale i{display:block;height:6px;border-radius:99px;background:var(--line)}
.scale span{display:block;font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--text-3);margin-top:6px}
.scale .on.ok i{background:var(--ok)}.scale .on.warn i{background:var(--warn)}.scale .on.crit i{background:var(--crit)}
.scale .on span{color:var(--text);font-weight:600}
.st-warn{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn-ink);font-size:var(--fs-sm);line-height:var(--lh-sm)}
.st-warn span{flex:1}

/* ============ KPI tiles ============ */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.tile{padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;transition:border-color .15s,box-shadow .15s,scale .15s ease-out}
.tile:active{scale:.98}
@media (hover:hover){.tile:hover{border-color:var(--accent-line);box-shadow:var(--sh-3)}}
.tile-h{display:flex;align-items:center;gap:10px;font-size:var(--fs-body);font-weight:500}
.tile-h .go{margin-left:auto;color:var(--text-3)}
.tile-vr{display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap}
.fig{font-size:var(--fs-fig);line-height:var(--lh-fig);font-weight:500;letter-spacing:-.02em}
.fig small{font-size:var(--fs-body);color:var(--text-2);font-weight:400;margin-left:3px;letter-spacing:0}
.pbar{height:8px;border-radius:99px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow .7s var(--ease) both}
.f-ok{background:var(--ok)}.f-warn{background:var(--warn)}.f-crit{background:var(--crit)}.f-acc{background:linear-gradient(90deg,var(--accent-2),var(--accent))}

/* ============ Home grid ============ */
.home-grid{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(340px,1fr);gap:16px;margin-top:16px;padding-bottom:24px;align-items:stretch}
#alertsCard{display:flex;flex-direction:column}

/* Alerts */
.al-list{display:grid;gap:8px;padding:0 16px}
.al{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;padding-right:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);transition:background-color .15s,border-color .15s}
.al.live{border-color:rgba(239,68,68,.3)}
@media (hover:hover){.al:hover{background:var(--raised)}}
.al.fresh{animation:flash 2s ease}
.al-main{display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;padding:12px;align-items:center;text-align:left;width:100%}
.al-title{display:flex;align-items:center;gap:8px;font-weight:500}
.al-imp{display:block;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2);margin-top:2px}
.imp-crit{color:var(--crit-ink)}.imp-warn{color:var(--warn-ink)}
.al-chev{display:none;color:var(--text-3)}
.card-f{display:flex;gap:8px;padding:12px 16px 16px;margin-top:auto}
.card-f .btn{flex:1}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:28px 24px 32px}
.empty .itile{margin-bottom:6px}
.empty b{font-weight:500}.empty p{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2);max-width:360px}
.av{width:20px;height:20px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:inline-grid;place-items:center;font-size:9px;font-weight:600;flex:none}
.av-lg{width:36px;height:36px;font-size:var(--fs-cap)}

/* ============ Sari: maskot & bubble ============ */
.sari{display:block;flex:none;overflow:visible}
.sari .hand{transform-box:fill-box;transform-origin:20% 90%}
@media (hover:hover){.fab-btn:hover .hand,.stage:hover .hand{animation:wave .8s var(--ease) 2}}
.buddy{display:flex;flex-direction:column}
.buddy-b{padding:0 16px 16px;display:flex;flex-direction:column;gap:14px;flex:1}
.stage{position:relative;display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:end;padding:16px 14px 14px;border-radius:14px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);overflow:hidden}
.stage::after{content:'';position:absolute;left:-30px;bottom:-60px;width:160px;height:160px;border-radius:50%;background:radial-gradient(closest-side,rgba(96,159,255,.28),rgba(96,159,255,0));pointer-events:none}
.stage .sari{position:relative;z-index:1;margin-bottom:-14px}
.say{position:relative;z-index:1;background:var(--card);border-radius:14px 14px 14px 4px;padding:12px 14px;box-shadow:var(--sh-2)}
.say::before{content:'';position:absolute;left:-6px;bottom:10px;width:12px;height:12px;background:var(--card);transform:rotate(45deg);border-radius:2px}
.say-h{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--text-3);margin-bottom:4px}
.say-h b{color:var(--accent-ink);font-weight:600}
.say p{position:relative}
.say .btn{margin-top:10px}
.next{display:inline-flex;align-items:center;gap:2px;font-size:var(--fs-cap);color:var(--text-2);height:24px;padding:0 6px;border-radius:6px;background:var(--raised)}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--accent-2);animation:dot 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
.sec-l{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;color:var(--text-2);margin-bottom:8px}
.sugg{display:flex;flex-wrap:wrap;gap:8px}
.sugg button,.chips button{min-height:36px;padding:7px 12px;border-radius:999px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2);font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;text-align:left;transition:background-color .15s,box-shadow .15s,color .15s}
@media (hover:hover){.sugg button:hover,.chips button:hover{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-2);color:var(--accent-ink)}}
.sugg button:disabled,.chips button:disabled{opacity:.5;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.ask{display:flex;align-items:center;gap:4px;border-radius:12px;padding:4px 4px 4px 14px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2),var(--sh-1);transition:box-shadow .15s;margin-top:auto}
.ask:focus-within{box-shadow:inset 0 0 0 2px var(--accent)}
.ask input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:38px;font-size:var(--fs-body)}
.ask input::placeholder{color:var(--text-3)}
.ask .mic,.ask .send{width:36px;height:36px;border-radius:9px;display:grid;place-items:center;flex:none;transition:background-color .15s,scale .15s ease-out}
.ask .mic{color:var(--text-2)}
@media (hover:hover){.ask .mic:hover{background:var(--raised)}}
.ask .mic.on{background:var(--crit-soft);color:var(--crit)}
.ask .send{background:linear-gradient(180deg,#3573F0,var(--accent));color:#fff}
.ask .send:disabled{opacity:.35;cursor:not-allowed}
.ask button:not(:disabled):active{scale:.94}
.resume{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-2);font-size:var(--fs-sm);line-height:var(--lh-sm);text-align:left;width:100%;color:var(--text-2)}
.resume span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.resume b{color:var(--text);font-weight:500}

/* FAB */
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:40;display:none;align-items:flex-end;gap:10px}
.fab.show{display:flex}
.fab-btn{width:64px;height:64px;border-radius:20px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line),var(--sh-3);display:grid;place-items:end center;flex:none;position:relative;overflow:visible;transition:scale .15s ease-out}
.fab-btn:active{scale:.94}
.fab-btn .online{position:absolute;top:-3px;right:-3px;width:14px;height:14px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 3px var(--bg)}
.fab-bub{position:relative;max-width:250px;background:var(--card);border-radius:14px 14px 4px 14px;box-shadow:var(--sh-3);border:1px solid var(--line);padding:10px 32px 12px 12px;font-size:var(--fs-sm);line-height:var(--lh-sm);text-align:left;margin-bottom:8px;animation:rise .35s var(--ease) both}
.fab-bub .say-h{margin-bottom:2px}
.fab-bub .x{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--text-3)}
.fab-bub .go{display:inline-flex;align-items:center;gap:2px;margin-top:6px;color:var(--accent);font-weight:600}

/* ============ Overlay: modal (desktop) / sheet (mobile) ============ */
.ov{position:fixed;inset:0;z-index:60;background:rgba(1,4,12,.4);display:none;align-items:center;justify-content:center;padding:24px}
.ov.open{display:flex;animation:fade .2s ease}
.dlg{width:min(540px,100%);max-height:min(780px,calc(100dvh - 48px));display:flex;flex-direction:column;background:var(--card);border-radius:20px;box-shadow:var(--sh-3);overflow:hidden;animation:pop .3s var(--ease)}
.dlg.chat{width:min(640px,100%);height:min(740px,calc(100dvh - 48px))}
.grab{display:none}
.dlg-h{display:flex;align-items:center;gap:12px;padding:16px 16px 12px 20px}
.dlg-h .t{flex:1;min-width:0}
.dlg-h h2{font-size:var(--fs-h);line-height:var(--lh-h);font-weight:500}
.dlg-h .sub{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2)}
.dlg-h .tags{display:flex;gap:6px;align-items:center;margin-bottom:4px}
.x-btn{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--text-2);flex:none;box-shadow:inset 0 0 0 1px var(--line-2)}
@media (hover:hover){.x-btn:hover{background:var(--raised)}}
.dlg-b{position:relative;padding:4px 20px 20px;overflow-y:auto;overscroll-behavior:contain;flex:1}
.dlg-f{padding:12px 20px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.impact{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.impact div{border-radius:12px;border:1px solid var(--line);background:var(--raised);padding:12px 14px}
.impact span{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2);display:block}
.impact b{font-size:var(--fs-h);line-height:var(--lh-h);font-weight:500;display:block}
.d-l{font-size:var(--fs-sm);line-height:var(--lh-sm);font-weight:500;color:var(--text-2);margin:16px 0 8px}
.tl{list-style:none;border-left:2px solid var(--line-2);margin-left:5px;padding-left:16px;display:grid;gap:8px}
.tl li{position:relative}
.tl li::before{content:'';position:absolute;left:-22px;top:7px;width:8px;height:8px;border-radius:50%;background:var(--card);border:2px solid var(--text-3)}
.tl li:last-child::before{border-color:var(--crit)}
.tl b{margin-right:8px;font-weight:500}
.pic{display:flex;align-items:center;gap:12px;border-radius:12px;border:1px solid var(--line);padding:10px 12px}
.pic b{display:block;font-weight:500}.pic span{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2)}
.choice{display:flex;gap:8px;flex-wrap:wrap}
.choice button{height:40px;padding:0 14px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-2);font-weight:500;transition:background-color .15s,box-shadow .15s}
.choice button.on{box-shadow:inset 0 0 0 1.5px var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
textarea{width:100%;border:0;border-radius:10px;box-shadow:inset 0 0 0 1px var(--line-2);padding:10px 12px;min-height:80px;resize:vertical;outline:0;font-size:var(--fs-body);line-height:var(--lh-body)}
textarea:focus{box-shadow:inset 0 0 0 2px var(--accent)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:8px 16px}
.kv span{color:var(--text-2)}
.note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--raised);border:1px solid var(--line);font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2)}
.note svg{margin-top:1px}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn-ink)}

/* Chat */
.thread{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.q{align-self:flex-end;max-width:80%;background:linear-gradient(180deg,#3573F0,var(--accent));color:#fff;border-radius:14px 14px 4px 14px;padding:10px 14px;animation:rise .25s var(--ease) both}
.a{display:grid;grid-template-columns:32px minmax(0,1fr);gap:10px;align-items:start;animation:rise .35s var(--ease) both}
.a-card{border:1px solid var(--line);background:var(--card);border-radius:4px 14px 14px 14px;padding:14px;box-shadow:var(--sh-1)}
.a-card.unsure{border-color:rgba(240,123,63,.45)}
.a-card.err{background:var(--crit-soft);border-color:transparent}
.a-who{font-size:var(--fs-cap);line-height:var(--lh-cap);font-weight:600;color:var(--accent-ink);margin-bottom:6px}
.a-head{font-size:var(--fs-title);line-height:var(--lh-title);font-weight:500}
.a-p{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2);margin-top:8px}
.a-list{margin-top:10px;padding-left:20px;display:grid;gap:6px}
.a-list b{font-weight:500}
.a-warn{display:flex;gap:8px;align-items:flex-start;background:var(--warn-soft);color:var(--warn-ink);padding:8px 10px;border-radius:8px;font-size:var(--fs-sm);line-height:var(--lh-sm);margin-top:10px}
.a-warn svg{margin-top:1px}
.cmp{margin-top:12px;display:grid;gap:8px}
.cmp-r{display:grid;grid-template-columns:130px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2)}
.cmp-r .tr{height:6px;background:var(--raised);border-radius:99px;overflow:hidden}
.cmp-r .tr i{display:block;height:100%;border-radius:99px}
.cmp-r b{color:var(--text);font-weight:500}
.a-src{margin-top:12px}
.a-src > span{font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--text-3);font-weight:500}
.src-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.src{display:inline-flex;align-items:center;gap:6px;min-height:30px;padding:4px 10px;border-radius:8px;background:var(--accent-soft);font-size:var(--fs-cap);line-height:var(--lh-cap);font-weight:500;color:var(--accent-ink);transition:background-color .15s}
.src.stale{color:var(--warn-ink);background:var(--warn-soft)}
@media (hover:hover){.src:hover{background:var(--accent-line)}}
.a-act{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.conf{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--text-2)}
.conf b{color:var(--text);font-weight:600}
.meter{display:inline-flex;gap:2px}
.meter i{width:4px;height:12px;border-radius:2px;background:var(--line-2)}
.meter.hi i{background:var(--ok)}.meter.md i:nth-child(-n+2){background:var(--warn)}.meter.lo i:first-child{background:var(--crit)}
.think{display:grid;gap:6px}
.think div{display:flex;align-items:center;gap:8px;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2)}
.think div.done{color:var(--text-3)}
.think .ck{color:var(--ok)}
.follow{display:grid;gap:10px;width:100%}
.avatar{width:32px;height:32px;border-radius:10px;background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent-line);display:grid;place-items:end center;overflow:hidden;flex:none}
.avatar.lg{width:40px;height:40px;border-radius:12px}

/* ============ Laporan ============ */
.topbar{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:72px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.back{text-decoration:none}
.topbar h1{font-size:var(--fs-h);line-height:var(--lh-h);font-weight:500}
.topbar .sub{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2)}
.topbar .t{flex:1;min-width:160px}
.tabs{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2);border-radius:12px;padding:4px;gap:4px}
.tabs button{height:36px;padding:0 18px;border-radius:8px;font-weight:500;color:var(--text-2);display:flex;align-items:center;justify-content:center;gap:8px;transition:background-color .15s,color .15s}
.tabs button[aria-selected=true]{background:var(--accent-soft);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-line)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;margin-top:20px;padding-bottom:120px;align-items:start}
.span2{grid-column:1/-1}
.rows{padding:0 16px 8px}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.row.hl{background:linear-gradient(90deg,var(--crit-soft),rgba(253,237,237,0) 70%);box-shadow:inset 3px 0 0 var(--crit)}
.row-n b{display:block;font-weight:500}
.row-n span{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2)}
.row-r{display:flex;align-items:center;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.row-r .amt{font-weight:500}
.row .full{grid-column:1/-1}
.track{height:6px;border-radius:99px;background:var(--raised);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;transform-origin:left;animation:grow .6s var(--ease) both}
.meta{font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.meta .w{color:var(--warn-ink);font-weight:500}
.fchip{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 4px 0 10px;border-radius:8px;background:var(--accent-soft);color:var(--accent-ink);font-size:var(--fs-sm);font-weight:500}
.fchip button{width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.stale-bar{display:flex;align-items:center;gap:10px;margin:0 16px 12px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn-ink);font-size:var(--fs-sm);line-height:var(--lh-sm)}
.stale-bar span{flex:1}
.figs{display:flex;gap:32px;flex-wrap:wrap;padding:0 16px 8px}
.figs span{display:block;font-size:var(--fs-sm);line-height:var(--lh-sm);color:var(--text-2)}
.figs b{font-size:var(--fs-h);line-height:var(--lh-h);font-weight:500}
.chart{padding:0 8px 8px}
.chart svg{display:block;width:100%;overflow:visible}
.chart text{font-family:inherit}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:var(--fs-cap);line-height:var(--lh-cap);color:var(--text-2);padding:0 16px 16px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:10px;height:10px;border-radius:3px;display:inline-block}
.dash{width:16px;border-top:2px dashed var(--text-2);display:inline-block}

/* ============ Skeleton, toast, demo ============ */
.sk{background:linear-gradient(90deg,var(--raised) 25%,#ECEDF0 50%,var(--raised) 75%);background-size:200% 100%;animation:sh 1.2s infinite;border-radius:8px}
.toasts{position:fixed;left:50%;bottom:24px;translate:-50% 0;display:grid;gap:8px;z-index:80;width:min(460px,calc(100vw - 32px))}
.toast{display:flex;align-items:center;gap:10px;background:var(--ink);color:#F5F5F5;border-radius:12px;padding:10px 12px 10px 14px;box-shadow:var(--sh-3);animation:rise .3s var(--ease) both}
.toast.ok .ti{color:#5BE39A}.toast.err .ti{color:#FF9B9B}
.toast span{flex:1}
.toast button{font-weight:600;color:var(--accent-2);height:32px;padding:0 8px;border-radius:8px}
.toast.out{animation:out .2s ease forwards}
.demo-btn{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:39;height:36px;padding:0 12px;border-radius:10px;background:var(--card);box-shadow:inset 0 0 0 1px var(--line-2),var(--sh-1);display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sm);font-weight:500;color:var(--text-2)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{height:36px;padding:0 12px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--line-2);font-size:var(--fs-sm);font-weight:500}
.seg button.on{background:var(--ink);color:#fff;box-shadow:none}
.sim{display:grid;gap:8px}
.sim-r{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--line)}
.sim-r .n{flex:1}.sim-r .n b{display:block;font-weight:500}.sim-r .n span{font-size:var(--fs-sm);color:var(--text-2)}
.wa{border-radius:12px;background:#E9F8EF;border:1px solid #C7EED6;padding:10px 12px;font-size:var(--fs-sm);line-height:20px}
.wa .wh{display:flex;justify-content:space-between;font-size:var(--fs-cap);font-weight:600;color:#15803D;margin-bottom:4px}
.foot{font-size:var(--fs-cap);color:var(--text-3);text-align:center;padding:0 16px 24px}
.lbl-m{display:none}
#tip{position:fixed;pointer-events:none;z-index:90;background:var(--ink);color:#F5F5F5;font-size:var(--fs-cap);line-height:var(--lh-cap);padding:6px 8px;border-radius:6px;opacity:0;transition:opacity .12s}
#tip.on{opacity:1}

@keyframes rot{to{transform:rotate(360deg)}}
@keyframes sh{to{background-position:-200% 0}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(239,68,68,.5)}70%{box-shadow:0 0 0 6px rgba(239,68,68,0)}100%{box-shadow:0 0 0 0 rgba(239,68,68,0)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes out{to{opacity:0;transform:translateY(8px)}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}}
@keyframes sheet{from{transform:translateY(100%)}}
@keyframes flash{0%,50%{background:var(--crit-soft)}100%{background:var(--card)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-18deg)}}
@keyframes dot{0%,100%{opacity:.3;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}
.gy{transform-box:fill-box;transform-origin:bottom;animation:growY .5s var(--ease) both}
.enter > *{animation:rise .4s var(--ease) both}
.enter > *:nth-child(2){animation-delay:.05s}.enter > *:nth-child(3){animation-delay:.1s}

/* ============ Mobile & tablet ============ */
@media (max-width:1023px){
  :root{--fs-fig:22px;--lh-fig:28px;--fs-h:18px;--lh-h:26px}
  .wrap{padding:0 16px}
  .top{padding-top:16px;padding-bottom:12px}
  .pill-meta,.lbl-d{display:none}
  .lbl-m{display:inline}
  .status{grid-template-columns:1fr;padding:14px 16px;gap:10px}
  .st-text{border-left:0;padding-left:0}
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:12px}
  .tile{padding:14px;gap:10px}
  .tile-h{font-size:var(--fs-sm)}
  .tile-h .itile{width:28px;height:28px;border-radius:8px}
  .tile-h .go{display:none}
  .home-grid{grid-template-columns:1fr;gap:12px;margin-top:12px;padding-bottom:120px}
  #buddyCard{display:none}
  .al-list{padding:0 12px}
  .card-h{padding:14px}
  .al-act{display:none}.al-chev{display:block}
  .ov{align-items:flex-end;padding:0}
  .dlg,.dlg.chat{width:100%;max-height:94dvh;border-radius:20px 20px 0 0;animation:sheet .35s var(--ease)}
  .dlg.chat{height:94dvh}
  .grab{display:block;width:36px;height:4px;border-radius:2px;background:var(--line-2);margin:8px auto 0;flex:none}
  .dlg-h{padding:10px 16px 8px}
  .dlg-b{padding:4px 16px 16px}
  .dlg-f{padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
  .dlg-f .btn{flex:1}
  .toasts{bottom:100px}
  .tabs{width:100%;order:3}
  .tabs button{padding:0 8px}
  .dgrid{grid-template-columns:1fr;gap:12px;margin-top:12px}
  .row{padding:12px 14px}
  .figs{padding:0 14px 8px;gap:20px}
  .legend{padding:0 14px 14px}
  .stale-bar{margin:0 14px 12px}
  .cmp-r{grid-template-columns:100px minmax(0,1fr) auto}
  .q{max-width:88%}
  .ask input,textarea{font-size:16px}
  .foot{padding-bottom:100px}
  .demo-btn{width:36px;padding:0;justify-content:center}
}
@media (min-width:1024px){ .fab.desk-show{display:flex} }
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<!-- ============ BERANDA ============ -->
<div id="home">
  <header class="wrap top" id="top"></header>
  <main class="wrap">
    <section class="card status" id="status" aria-live="polite"></section>
    <section class="tiles" id="tiles" aria-label="Angka utama"></section>
    <div class="home-grid">
      <section class="card" id="alertsCard" aria-label="Perlu tindakan"></section>
      <aside class="card buddy" id="buddyCard" aria-label="Asisten Sari"></aside>
    </div>
  </main>
</div>

<!-- ============ LAPORAN (detail, 3 tab) ============ -->
<div id="detail" hidden>
  <header class="topbar"><div class="wrap">
    <a class="btn btn-s back" href="#beranda" aria-label="Kembali ke Beranda"></a>
    <div class="t"><h1>Laporan</h1><div class="sub" id="dSub"></div></div>
    <div class="tabs" role="tablist" id="tabs"></div>
  </div></header>
  <main class="wrap" id="dBody"></main>
</div>

<p class="foot">Data fiktif untuk Design Test Fugo Creative · Ikon: Lucide (ISC) · Font: Inter Tight (OFL)</p>

<div class="fab" id="fab"></div>
<button class="demo-btn" id="demoBtn" data-act="demo"></button>
<div class="ov" id="ov"><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgTitle"></div></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div id="tip" role="tooltip"></div>

<script>
/* ================= Ikon (Lucide, ISC) ================= */
const P={
  chev:'<path d="m9 18 6-6-6-6"/>',
  left:'<path d="m12 19-7-7 7-7"/><path d="M19 12H5"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  tri:'<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3"/><path d="M12 9v4M12 17h.01"/>',
  oct:'<path d="M7.86 2h8.28L22 7.86v8.28L16.14 22H7.86L2 16.14V7.86Z"/><path d="M12 8v4M12 16h.01"/>',
  check:'<path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="M22 4 12 14.01l-3-3"/>',
  ck:'<path d="M20 6 9 17l-5-5"/>',
  user:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="m16 11 2 2 4-4"/>',
  wa:'<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/>',
  db:'<ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14a9 3 0 0 0 18 0V5"/><path d="M3 12a9 3 0 0 0 18 0"/>',
  refresh:'<path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/>',
  report:'<rect width="8" height="4" x="8" y="2" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M12 11h4M12 16h4M8 11h.01M8 16h.01"/>',
  send:'<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
  mic:'<path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><path d="M12 19v3"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',
  sliders:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
  factory:'<path d="M2 20a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8l-7 5V8l-7 5V4a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z"/>',
  box:'<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5M12 22V12"/>',
  wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  wifioff:'<path d="M12 20h.01M8.5 16.43a5 5 0 0 1 7 0M2 8.82a15 15 0 0 1 4.17-2.65M10.66 5c4.01-.36 8.14.9 11.34 3.76M16.85 11.25a10 10 0 0 1 2.22 1.68M5 13a10 10 0 0 1 5.24-2.76M2 2l20 20"/>',
  play:'<path d="m6 3 14 9-14 9V3z"/>',
  bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/>',
  trend:'<path d="M22 7 13.5 15.5l-5-5L2 17"/><path d="M16 7h6v6"/>',
  receipt:'<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8M12 17.5v-11"/>',
  bars:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9M13 17V5M8 17v-3"/>',
  store:'<path d="M3 9h18l-1.5-5h-15Z"/><path d="M4 9v11h16V9M9 20v-6h6v6"/>',
  up:'<path d="m5 12 7-7 7 7"/><path d="M12 19V5"/>',
  down:'<path d="M12 5v14"/><path d="m19 12-7 7-7-7"/>',
  eye:'<path d="M2.06 12.35a1 1 0 0 1 0-.7 10.75 10.75 0 0 1 19.88 0 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-19.88 0"/><circle cx="12" cy="12" r="3"/>'
};
const ic=(n,c='')=>`<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const el=id=>document.getElementById(id);
const fmt=n=>Math.round(n).toLocaleString('id-ID');
const dec=(n,d=1)=>n.toFixed(d).replace('.',',');
const rp=jt=>jt>=1000?`Rp ${dec(jt/1000,2)} M`:`Rp ${fmt(jt)} jt`;
const sum=a=>a.reduce((x,y)=>x+y,0);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ================= Maskot: Sari =================
   Kacang (produk Kacang Atom) + headset (= siap membantu). Flat dua-tone.
   Mood: idle | think | happy | worry · head=true untuk avatar kecil       */
function sari(size=72,mood='idle',head=false){
  const k='#1B1206',ey=mood==='think'?31:33;

function routeQ(q){const s=q.toLowerCase();
  if(/harga|cuaca|prediksi|bulan depan|kurs/.test(s))return'oos';
  if(/omzet|penjualan|jualan/.test(s))return /turun|kenapa|mengapa|anjlok/.test(s)?'omzet':'omzet';
  if(/minggu depan|akan jatuh tempo|faktur/.test(s))return'jatuhTempo';
  if(/piutang|bayar|tagih|telat/.test(s))return'piutang';
  if(/reject|cacat|rusak|bocor/.test(s))return'reject';
  if(/lini ?2|kerugian|berhenti|mesin|rugi/.test(s))return'lini2';
  if(/bahan|beli|stok|pesan|kacang tanah|po\b/.test(s))return'bahan';
  if(/produksi/.test(s))return'clarifyProd';
  return'clarify'}

function renderChat(){

    :`<div class="a-card"><div class="a-who">Sari sedang memeriksa</div><div class="think">${ANS[e.key].steps.slice(0,e.step+1).map((s,i)=>i<e.step?`<div class="done">${ic('ck','i-sm ck')}${s}</div>`:`<div><span class="spin" style="color:var(--accent)"></span>${s}…</div>`).join('')}</div></div>`}</div>`).join('');
  const last=S.convo[S.convo.length-1],f=last&&last.done?ANS[last.key].follow:[];
  el('chatFoot').innerHTML=`<div class="follow">${f.length?`<div class="sec-l">Lanjut tanya</div><div class="chips">${f.map(q=>`<button data-act="ask" data-q="${q}" ${S.thinking?'disabled':''}>${q}</button>`).join('')}</div>`:''}${askForm('Tanya lagi ke Sari')}</div>`;
  const b=el('chatBody'),qs=th.querySelectorAll('.q'),lq=qs[qs.length-1];requestAnimationFrame(()=>{b.scrollTop=lq?lq.offsetTop-8:0});
}
function openChat(){if(!S.dlg||S.dlg.kind!=='chat'){openDialog(chatShell(),'chat',{kind:'chat'})}renderChat()}
function ask(q){
  if(!q)return;
  if(S.thinking){S.queue.push(q);return}
  const key=(S.mode==='error'||S.mode==='offline')?'err':routeQ(q);
  const e={q,key,step:0,done:false};S.convo.push(e);S.lastQ=q;
  openChat();setThinking(true);
  const a=ANS[key];
  const tick=()=>{
    if(e.step<a.steps.length-1){e.step++;renderChat();setTimeout(tick,700)}
    else{setTimeout(()=>{e.done=true;e.html=a.html();setThinking(false);renderChat();if(S.queue.length)setTimeout(()=>ask(S.queue.shift()),900)},800)}
  };
  renderChat();setTimeout(tick,700);
}

/* ================= Grafik batang ================= */
const CH={};
function barChart(w,o){
  const H=230,pl=48,pr=8,pt=o.annot?40:20,pb=30,iw=w-pl-pr,ih=H-pt-pb,n=o.vals.length;
  const y=v=>pt+ih*(1-v/o.top),bw=iw/n,barW=Math.max(14,Math.min(44,bw*.56));
  let g='';
  for(let v=0;v<=o.top;v+=o.step)g+=`<line x1="${pl}" x2="${pl+iw}" y1="${y(v)}" y2="${y(v)}" stroke="#ECECEE"/><text x="${pl-10}" y="${y(v)+4}" text-anchor="end" font-size="12" fill="#626875">${o.yf(v)}</text>`;
  o.vals.forEach((v,i)=>{const x=pl+i*bw+(bw-barW)/2,ok=v>=o.target*.95,last=i===n-1;
    g+=`<rect class="gy" style="animation-delay:${i*40}ms" x="${x}" y="${y(v)}" width="${barW}" height="${y(0)-y(v)}" rx="4" fill="${ok?'#2463EB':'#F07B3F'}" data-tip="${o.tf(v,i)}"><title>${o.tf(v,i)}</title></rect>`;
    g+=`<text x="${x+barW/2}" y="${y(v)+18}" text-anchor="middle" font-size="12" font-weight="600" fill="${ok?'#fff':'#4A1D06'}">${o.vf(v)}</text>`;
    g+=`<text x="${x+barW/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#4F5562" font-weight="${last?600:400}">${o.lbl[i]}</text>`});
  const ty=y(o.target);
  g+=`<line x1="${pl}" x2="${pl+iw}" y1="${ty}" y2="${ty}" stroke="#01040C" stroke-width="1.5" stroke-dasharray="5 4"/>`;
  if(o.annot){const cx=pl+o.annot.i*bw+bw/2,anchor=o.annot.i>n*.5?'end':'start';
    g+=`<line x1="${cx}" x2="${cx}" y1="18" y2="${y(o.vals[o.annot.i])-22}" stroke="#EF4444" stroke-dasharray="2 3"/><circle cx="${cx}" cy="18" r="3" fill="#EF4444"/><text x="${anchor==='start'?cx-4:cx+4}" y="11" text-anchor="${anchor}" font-size="12" font-weight="600" fill="#B42318">${o.annot.t}</text>`}
  return `<svg viewBox="0 0 ${w} ${H}" height="${H}" role="img" aria-label="${o.aria}">${g}</svg>`;
}
function drawCharts(){document.querySelectorAll('[data-chart]').forEach(c=>{const f=CH[c.dataset.chart];if(f)c.innerHTML=f(Math.max(280,c.clientWidth-24))})}

document.addEventListener('mouseout',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');if(t)tip.classList.remove('on')});

function simGo(k){

/* ================= Toast ================= */
function toast(msg,type='ok',action){
  const w=el('toasts'),t=document.createElement('div');t.className='toast '+type;t.setAttribute('role',type==='err'?'alert':'status');
  t.innerHTML=`<span class="ti">${ic(type==='err'?'tri':'check')}</span><span>${msg}</span>${action?`<button>${action.label}</button>`:''}`;
  w.appendChild(t);const kill=()=>{t.classList.add('out');setTimeout(()=>t.remove(),200)};
  if(action)t.querySelector('button').onclick=()=>{action.fn();kill()};
  setTimeout(kill,action?5000:3500);
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act;if(t.tagName==='A')e.preventDefault();
  switch(act){
    case'alert':openAlert(t.dataset.id);break;
    case'assign-open':openAlert(t.dataset.id,'assign');break;
    case'assign-step':S.dlg.step='assign';alertDlg();setTimeout(()=>el('sendBtn').focus(),40);break;
    case'assign-back':S.dlg.note=el('note').value;S.dlg.step='detail';alertDlg();break;
    case'due':S.dlg.due=t.dataset.v;S.dlg.note=el('note').value;alertDlg();break;
    case'send-task':sendTask();break;
    case'ack':{const a=ALERTS.find(x=>x.id===S.dlg.id);S.handled[a.id]={pic:a.pic.n,ack:true};closeDialog();renderAll();toast('Ditandai sudah diketahui. Alert pindah ke "Sedang ditangani".','ok',{label:'Batalkan',fn:()=>{delete S.handled[a.id];renderAll()}});break}
    case'wa':toast(`Di aplikasi asli, ini membuka chat WhatsApp ${t.dataset.n}.`,'ok');break;
    case'undo':delete S.handled[t.dataset.id];renderAll();allAlerts('handled');break;
    case'all-alerts':allAlerts(t.dataset.sec);break;
    case'close':closeDialog();break;
    case'ask':ask(t.dataset.q);break;
    case'retry-ask':ask(S.lastQ);break;
    case'open-chat':openChat();break;
    case'buddy':if(isDesk()&&S.view==='home'){el('buddyCard').querySelector('input').focus()}else buddySheet();break;
    case'next-tip':S.tipIdx++;renderBuddy();if(S.dlg&&S.dlg.kind==='buddy')buddySheet();break;
    case'hide-tip':S.fabTip=false;renderFab();break;
    case'mic':{const f=t.closest('form'),inp=f.q;t.classList.add('on');inp.value='';inp.placeholder='Mendengarkan…';
      setTimeout(()=>{t.classList.remove('on');inp.placeholder='Tanya Sari…';ask('Berapa kerugian Lini 2 pagi ini?')},1600);break}
    case'src':{const s=t.dataset.src;closeDialog();if(s==='sales')S.aiFilter=true;
      go({sales:'uang',piutang:'uang',prod:'produksi',stok:'stok'}[s],s==='piutang'?'piutang':s==='sales'?'distCard':null);break}
    case'tab':closeDialog();go(t.dataset.v,t.dataset.anc);break;
    case'clear-ai':S.aiFilter=false;renderDetail();break;
    case'info':openInfo(t.dataset.k);break;
    case'req-update':toast('Permintaan update data terkirim ke Bu Rina.','ok');break;
    case'refresh':{const b=el('refreshBtn');b&&b.classList.add('spinning');refresh();break}
    case'retry':refresh('normal');setTimeout(()=>toast('Data berhasil diperbarui.','ok'),950);break;
    case'demo':demoDlg();break;
    case'mode':S.mode=t.dataset.v;S.tipIdx=0;S.fabTip=true;renderAll();demoDlg();if(S.mode==='loading')setTimeout(()=>{S.mode='normal';renderAll();if(S.dlg&&S.dlg.kind==='demo')demoDlg()},1500);break;
    case'reason':S.simReason=t.dataset.v;demoDlg();break;
    case'sim-stop':simStop(t.dataset.v);break;
    case'sim-go':simGo(t.dataset.v);break;
    case'demo-convo':closeDialog();ask('Kenapa omzet minggu ini turun?');S.queue.push('Berapa piutang yang sudah lewat jatuh tempo dan siapa saja?');break;
  }
});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form!=='ask')return;e.preventDefault();const v=f.q.value.trim();if(!v)return;f.q.value='';ask(v)});
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('form[data-form=ask]');if(f)f.querySelector('.send').disabled=!e.target.value.trim()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&el('ov').classList.contains('open'))closeDialog();
  if(e.key==='Tab'&&el('ov').classList.contains('open')){const f=[...el('dlg').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,[href]')];if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
});
el('ov').addEventListener('click',e=>{if(e.target===el('ov'))closeDialog()});
addEventListener('hashchange',route);
setInterval(()=>{if(['normal','error','offline'].includes(S.mode)&&!el('ov').classList.contains('open'))renderAll()},30000);

/* ================= Boot ================= */
let tuckT;function tuck(){clearTimeout(tuckT);tuckT=setTimeout(()=>{if(!isDesk()||S.view==='detail'){S.fabTip=false;renderFab()}},10000)}
document.querySelector('.back').innerHTML=`${ic('left')}Beranda`;
route();
setTimeout(()=>{S.mode='normal';renderAll();tuck()},900);
</script>
</body>
</html>
