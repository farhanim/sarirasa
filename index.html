function buddySheet(){openDialog(`<div class="grab"></div><div class="dlg-h">${avatar(S.thinking?'think':(curTip()[0].mood||'idle'))}<div class="t"><h2 id="dlgTitle">Sari</h2><div class="sub">AI assistant · reads factory data</div></div><button class="x-btn" data-act="close" aria-label="Close">${ic('x','i-sm')}</button></div><div class="dlg-b"><div class="buddy-b" style="padding:0">${buddyBody()}</div></div><div class="dlg-f">${askBlock()}</div>`,'',{kind:'buddy'})}

/* ================= Demo & simulation ================= */
const REASONS=['Sensor / oven','Out of material','Packing jam','Power cut'];
function demoDlg(){
  const modes=[['normal','Normal'],['loading','Loading'],['error','Sync error'],['offline','Offline'],['clear','No alerts']];
  const body=`<div class="grab"></div><div class="dlg-h">${itile('sliders')}<div class="t"><h2 id="dlgTitle">Demo mode</h2><div class="sub">For presenting each state and flow</div></div><button class="x-btn" data-act="close" aria-label="Close">${ic('x','i-sm')}</button></div>
   <div class="dlg-b"><div class="d-l" style="margin-top:0">Data state</div><div class="dseg">${modes.map(([k,l])=>`<button class="${S.mode===k?'on':''}" data-act="mode" data-v="${k}">${l}</button>`).join('')}</div>
    <div class="d-l">Supervisor tablet ("Line report")</div><p class="muted" style="font-size:13px;margin-bottom:8px">A supervisor taps a button on the line tablet. The alert appears here and on WhatsApp. Two lines down turns the status Critical; Normal puts every line back and the status On track.</p>
    <div class="choice" style="margin-bottom:8px"><button class="${health().lvl==='ok'?'on':''}" data-act="sim-normal">${ic('ck','i-xs')}Normal · all running</button>${REASONS.map(r=>`<button class="${S.simReason===r&&health().lvl!=='ok'?'on':''}" data-act="reason" data-v="${r}">${r}</button>`).join('')}</div>
    <div class="sim">${LK.map(k=>{const st=S.lines[k].stop;return `<div class="sim-r"><div class="n"><b>${PROD[k].n} · ${PROD[k].short}</b><span>${st?`Stopped ${minTxt(k)} · ${S.lines[k].reason}`:S.lines[k].resumed?`Running again since ${S.lines[k].resumed}`:'Running'}</span></div>${st?`<button class="btn btn-s btn-sm" data-act="sim-go" data-v="${k}">${ic('ck','i-xs')}Running again</button>`:`<button class="btn btn-sm" style="background:var(--crit);color:#fff" data-act="sim-stop" data-v="${k}">${ic('oct','i-xs')}Report stop</button>`}</div>`}).join('')}</div>
    <div class="d-l">Last WhatsApp message</div><div class="wa"><div class="wh"><span>Sari Rasa Control Room</span><span>${S.wa.t}</span></div>${S.wa.l.join('<br>')}</div>
    <div class="d-l">Assistant</div><button class="btn btn-s" data-act="demo-convo">${ic('play','i-xs')}Play 2 sample questions</button>
    <p class="muted" style="font-size:12px;margin-top:16px">Fictional data for the Fugo Creative design test · Icons: Lucide (ISC) · Font: Inter Tight (OFL)</p></div>`;
  if(S.dlg&&S.dlg.kind==='demo')el('dlg').innerHTML=body;else openDialog(body,'',{kind:'demo'});
}
function simStop(k){
  const since=clock(),n=PROD[k].n,reason=S.simReason;S.onTarget=false;
  S.lines[k]={stop:true,since,base:0,t:Date.now(),reason,prev:S.lines[k].prev||0};
  const id='m'+k+Date.now();
  const a={id,sev:'crit',live:true,fresh:true,line:k,area:'Production',title:()=>`${n} stopped · ${lineMin(k)?lineMin(k)+' min':'just now'}`,impact:()=>lossTxt(k),
    pct:()=>Math.max(2,Math.min(100,RATE[k]*lineMin(k)/PROD[k].t*100)),bar:()=>`${reason} · reported by Pak Joko`,
    cause:`Reported by the supervisor on the line tablet: ${reason.toLowerCase()}.`,tl:[[since,'Supervisor reported the stop'],[since,'Alert sent to you and Pak Budi on WhatsApp']],
    pic:{n:'Pak Budi',r:'Plant Manager',i:'BU',a:'Active 5 min ago'},time:`since ${since}`,k1:['Output lost',()=>lineMin(k)?`−${pcsOf(k)} pcs`:'Just started',PROD[k].p],k2:['Estimated loss',()=>lossTxt(k),`about Rp ${perMin(k)}K more each minute`],tab:'production'};
  ALERTS.unshift(a);setTimeout(()=>{a.fresh=false},2500);
  S.wa={t:since,l:[`${n} stopped (${since})`,`Cause: ${reason.toLowerCase()}`,'Owner: Pak Budi',`Losing about Rp ${perMin(k)}K/min until it restarts`]};
  S.tipIdx=0;S.fabTip=true;tuck();if(S.mode==='clear')S.mode='normal';
  closeDialog();render();setTimeout(()=>openAlert(id,'detail',true),400);
}
// Normal: every line running, no open alerts, revenue on target -> status On track
function simNormal(){const now=clock();
  for(let i=ALERTS.length-1;i>=0;i--)if(ALERTS[i].live)ALERTS.splice(i,1);
  LK.forEach(k=>{if(S.lines[k].stop)S.lines[k]={stop:false,resumed:now,prev:(S.lines[k].prev||0)+lineMin(k)}});
  S.mode='clear';S.onTarget=true;S.tipIdx=0;
  S.wa={t:now,l:[`All lines running (${now})`,'No open alerts','Revenue on target']};
  render();demoDlg();toast('Everything is back to normal. Status is On track.','ok');
}
function simGo(k){
  const n=PROD[k].n,mins=lineMin(k),loss=lossOf(k),now=clock();
  for(let i=ALERTS.length-1;i>=0;i--)if(ALERTS[i].line===k&&ALERTS[i].live){delete S.handled[ALERTS[i].id];ALERTS.splice(i,1)}
  S.lines[k]={stop:false,resumed:now,prev:(S.lines[k].prev||0)+mins};
  S.wa={t:now,l:[`${n} running again (${now})`,`Stopped for ${mins} min`,`Estimated loss ±Rp ${loss}M`]};
  render();demoDlg();toast(`Good news: ${n} is running again. I\'ve closed the alert.`,'ok');
}

/* ================= Toast ================= */
function toast(msg,type='ok',action){
  const w=el('toasts'),t=document.createElement('div');t.className='toast '+type;t.setAttribute('role',type==='err'?'alert':'status');
  t.innerHTML=`<span class="ti">${ic(type==='err'?'tri':type==='info'?'info':'check','i-sm')}</span><span class="tm">${msg}</span>${action?`<button>${action.label}</button>`:''}`;
  w.appendChild(t);const kill=()=>{t.classList.add('out');setTimeout(()=>t.remove(),200)};
  if(action)t.querySelector('button').onclick=()=>{action.fn();kill()};
  setTimeout(kill,action?5000:3500);
}

/* ================= Routing & render ================= */
/* Mobile: swipe left/right to move between tabs. The page follows the finger; release past ~22% of the
   width (or with a quick flick) to change tab, otherwise it springs back. Rubber-band at the first/last tab. */
(function(){const v=el('view');let sx=0,sy=0,st=0,dx=0,axis=null,on=false,lastX=0,lastT=0,vel=0;
  const scrollsX=n=>{for(;n&&n!==v;n=n.parentElement){if(n.matches&&n.matches('input,textarea,select,.seg,[data-tip]'))return true;const cs=getComputedStyle(n);if(/(auto|scroll)/.test(cs.overflowX)&&n.scrollWidth>n.clientWidth+2)return true}return false};
  const idx=()=>TABS.findIndex(x=>x[0]===S.tab);
  const set=(x,anim)=>{v.style.transition=anim?'transform .26s cubic-bezier(.22,1,.36,1),opacity .26s ease':'none';v.style.transform=x?`translate3d(${x}px,0,0)`:'';v.style.opacity=x?String(1-Math.min(.35,Math.abs(x)/innerWidth*.6)):''};
  v.addEventListener('touchstart',e=>{on=false;if(isDesk()||e.touches.length!==1||el('ov').classList.contains('open')||scrollsX(e.target))return;
    const t=e.touches[0];sx=lastX=t.clientX;sy=t.clientY;st=lastT=Date.now();dx=0;vel=0;axis=null;on=true},{passive:true});
  v.addEventListener('touchmove',e=>{if(!on)return;const t=e.touches[0],mx=t.clientX-sx,my=t.clientY-sy;
    if(!axis){if(Math.abs(mx)<8&&Math.abs(my)<8)return;axis=Math.abs(mx)>Math.abs(my)*1.2?'x':'y';if(axis==='y'){on=false;return}}
    const i=idx(),edge=(mx>0&&i===0)||(mx<0&&i===TABS.length-1);dx=edge?mx*.25:mx;
    const now=Date.now();vel=(t.clientX-lastX)/Math.max(1,now-lastT);lastX=t.clientX;lastT=now;set(dx,false)},{passive:true});
  const end=()=>{if(!on)return;on=false;if(axis!=='x'){set(0,true);return}
    const i=idx(),dir=dx<0?1:-1,j=i+dir,far=Math.abs(dx)>innerWidth*.22||(Math.abs(dx)>40&&Math.abs(vel)>.45&&Math.sign(vel)===Math.sign(dx));
    if(j<0||j>=TABS.length||!far){set(0,true);setTimeout(()=>{v.style.transition=''},280);return}
    set(-dir*innerWidth*.6,true);setTimeout(()=>{S.swipeDir=dir>0?'l':'r';v.style.transition='none';v.style.transform='';v.style.opacity='';go(TABS[j][0])},170)};
  v.addEventListener('touchend',end,{passive:true});v.addEventListener('touchcancel',()=>{if(on){on=false;set(0,true)}},{passive:true});
})();
function go(tab,anc){location.hash=tab;if(anc)setTimeout(()=>{const a=el(anc);a&&a.scrollIntoView({block:'nearest',behavior:'smooth'})},150)}
function route(){const h=location.hash.slice(1);const t=TABS.some(x=>x[0]===h)?h:'overview';if(t!=='finance')S.aiFilter=false;S.tab=t;render(true)}
/* Loading skeletons: same grid + card structure as each tab, so nothing jumps when data arrives */
const skHead=()=>`<div class="card-h"><div class="sk" style="width:24px;height:22px;border-radius:6px;flex:none"></div><div class="ch-t"><div class="sk" style="width:44%;height:14px"></div><div class="sk" style="width:66%;height:11px;margin-top:7px"></div></div></div>`;
const skChart=(n=7)=>`<section class="card col">${skHead()}<div class="sk-leg"><span class="sk"></span><span class="sk"></span><span class="sk"></span></div><div class="sk-chart">${Array.from({length:n},(_,i)=>`<i class="sk" style="height:${[72,64,58,76,66,70,61][i%7]}%"></i>`).join('')}</div></section>`;
const skRows=n=>`<div class="sk-rows">${Array.from({length:n},()=>`<div><span><i class="sk" style="width:58%;height:12px"></i><i class="sk" style="width:36%;height:10px;margin-top:6px"></i></span><i class="sk" style="width:64px;height:12px"></i></div>`).join('')}</div>`;
const skList=(n,cls='',style='')=>`<section class="card col ${cls}" style="${style}">${skHead()}${skRows(n)}</section>`;
const skMinis=()=>`<div class="minis">${[1,2,3,4].map(()=>`<div class="card mini"><div class="ch-t" style="flex:1"><div class="sk" style="width:58%;height:11px"></div><div class="sk" style="width:38%;height:16px;margin-top:8px"></div></div></div>`).join('')}</div>`;
const skLineCard=()=>`<section class="card lc">${skHead()}<div class="sk-lc"><div class="sk" style="height:54px;border-radius:10px"></div><div class="sk" style="height:10px;width:70%"></div><div class="sk" style="height:8px"></div><div class="sk" style="height:10px;width:55%"></div></div></section>`;
const SKEL={
  production:()=>`<div class="lines">${skLineCard()+skLineCard()+skLineCard()}</div><div class="g2">${skChart()}${skChart()}</div>`,
  stock:()=>`${skKpis()}<div class="g2">${skList(6)}<div class="stack">${skList(3,'','flex:none')}${skList(3,'','flex:1')}</div></div>`,
  finance:()=>`${skKpis()}<div class="fgrid">${skChart()}${skList(5)}${skList(7,'r2')}</div>`
};
function render(anim=true){
  renderTop();
  const v=el('view');v.classList.toggle('static',!anim);
  if(S.tab==='overview')v.innerHTML=`${syncBanner()}${statusHTML()}${kpisHTML()}<div class="ov-grid">${alertsCardHTML()}${chartCardHTML()}${S.mode==='loading'?'<aside class="card col" id="buddyCard"></aside>':buddyCardHTML()}</div>`;
  else if(S.mode==='loading')v.innerHTML=SKEL[S.tab]();
  else v.innerHTML=`${syncBanner()}<div class="view-in" style="display:contents">${{production:viewProduction,stock:viewStock,finance:viewFinance}[S.tab]()}</div>`;
  if(anim)v.firstElementChild&&v.classList.add('enter');
  v.classList.remove('swipe-l','swipe-r');if(S.swipeDir){void v.offsetWidth;v.classList.add('swipe-'+S.swipeDir);S.swipeDir=null;scrollTo({top:0})}
  renderSyncPop();
  // offline: content goes grayscale and is blocked (inert) so nobody acts on stale numbers
  const off=S.mode==='offline';v.classList.toggle('is-offline',off);v.inert=off;const fb=el('fab');if(fb){fb.classList.toggle('is-offline',off);fb.inert=off}
  requestAnimationFrame(()=>{drawCharts();document.querySelectorAll('.prompts').forEach(updPrompts)});
  renderFab();
  el('demoBtn').innerHTML=ic('sliders','i-sm');
}
function refresh(next){
  const b=el('refreshBtn');b&&b.classList.add('spinning');
  const prev=S.mode==='loading'?'normal':S.mode;S.mode='loading';render();
  setTimeout(()=>{S.mode=next||prev;S.updated=clock();render()},900);
}

/* ================= Events ================= */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');if(!t)return;
  const act=t.dataset.act;if(t.tagName==='A')e.preventDefault();
  switch(act){
    case'alert':openAlert(t.dataset.id);break;
    case'assign-open':openAlert(t.dataset.id,'assign');break;
    case'assign-step':S.dlg.step='assign';alertDlg();setTimeout(()=>el('sendBtn').focus(),40);break;
    case'assign-back':S.dlg.note=el('note').value;S.dlg.step='detail';alertDlg();break;
    case'due':S.dlg.due=t.dataset.v;S.dlg.note=el('note').value;alertDlg();break;
    case'send-task':sendTask();break;
    case'ack':{const a=ALERTS.find(x=>x.id===S.dlg.id);S.handled[a.id]={pic:a.pic.n,ack:true};closeDialog();render();toast('Marked as seen. You\'ll find it under In progress.','ok',{label:'Undo',fn:()=>{delete S.handled[a.id];render()}});break}
    case'wa':toast(`This would open a WhatsApp chat with ${t.dataset.n}. Not available in the demo.`,'info');break;
    case'undo':delete S.handled[t.dataset.id];render();allAlerts('handled');break;
    case'all-alerts':allAlerts(t.dataset.sec);break;
    case'close':closeDialog();break;
    case'ask':ask(t.dataset.q);break;
    case'retry-ask':ask(S.lastQ);break;
    case'open-chat':openChat();break;
    case'buddy':buddySheet();break;
    case'al-more':S.alMore=!S.alMore;render(false);break;
    case'next-tip':stepTip(1);break;
    case'prompts-more':{const r=t.parentElement.querySelector('.prompts');r.scrollBy({left:Math.max(160,r.clientWidth*.7),behavior:'smooth'});break}
    case'theme':{const next=isDark()?'light':'dark',r=t.getBoundingClientRect();
      // circle reveal from the toggle (View Transitions); fallback: short color fade; reduced motion: instant
      if(matchMedia('(prefers-reduced-motion: reduce)').matches){setTheme(next);break}
      if(document.startViewTransition){const root=document.documentElement;root.style.setProperty('--vx',(r.left+r.width/2)+'px');root.style.setProperty('--vy',(r.top+r.height/2)+'px');{const x=r.left+r.width/2,y=r.top+r.height/2;root.style.setProperty('--vr',Math.hypot(Math.max(x,innerWidth-x),Math.max(y,innerHeight-y))+'px')}S.themeSpin=true;document.startViewTransition(()=>setTheme(next))}
      else{document.documentElement.classList.add('theme-fade');setTheme(next);setTimeout(()=>document.documentElement.classList.remove('theme-fade'),560)}
      break}
    case'prev-tip':stepTip(-1);break;
    case'pause-tip':S.tipPaused=!S.tipPaused;refreshInsight();const pb=document.querySelector('[data-act=pause-tip]');if(pb)pb.focus();break;
    case'hide-tip':S.fabTip=false;renderFab();break;
    case'no-invite':S.noInvite=true;clearTimeout(invT);invState='';renderFab();break;
    case'mic':{const f=t.closest('form'),inp=f.q;t.classList.add('on');inp.value='';inp.placeholder='Listening…';setTimeout(()=>{t.classList.remove('on');inp.placeholder='Ask Sari anything…';ask('Line 2 losses today')},1600);break}
    case'src':{const s=t.dataset.src;closeDialog();if(s==='sales'){S.aiFilter=true;S.fp='7d'}go({sales:'finance',piutang:'finance',prod:'production',stok:'stock'}[s],s==='piutang'?'recv':s==='sales'?'distCard':null);if(s==='prod'){S.pf='L2'}break}
    case'tab':closeDialog();if(S.tab===t.dataset.v)render(true);go(t.dataset.v,t.dataset.anc);break;
    case'pf':S.pf=t.dataset.v;render();break;
    case'sf':S.sf=t.dataset.v;render();break;
    case'sact':S.sAct=t.checked;render();break;
    case'clear-stock-filter':S.sAct=false;S.sf='all';render(false);break;
    case'fp':S.fp=t.dataset.v;render();break;
    case'clear-ai':S.aiFilter=false;render();break;
    case'info':openInfo(t.dataset.k);break;
    case'export':toast('Export isn\'t available in this demo. In the live app, the file downloads right away.','info');break;
    case'req-update':toast('Asked Bu Rina to sync the finance data. I\'ll update the numbers when it arrives.','ok');break;
    case'refresh':refresh();break;
    case'retry':refresh('normal');setTimeout(()=>toast(`All up to date as of ${S.updated}.`,'ok'),950);break;
    case'demo':demoDlg();break;
    case'mode':S.mode=t.dataset.v;S.onTarget=false;S.syncHide=null;S.tipIdx=0;S.fabTip=true;render();demoDlg();if(S.mode==='loading')setTimeout(()=>{S.mode='normal';render();if(S.dlg&&S.dlg.kind==='demo')demoDlg()},1500);break;
    case'reason':S.simReason=t.dataset.v;demoDlg();break;
    case'sim-stop':simStop(t.dataset.v);break;
    case'sim-go':simGo(t.dataset.v);break;
    case'sim-normal':simNormal();break;
    case'sync-hide':S.syncHide=S.mode;renderSyncPop();break;
    case'demo-convo':closeDialog();ask('Why is revenue down?');S.queue.push('Who pays late?');break;
  }
});
document.addEventListener('change',e=>{const s=e.target.dataset&&e.target.dataset.sel;if(s){S[s]=e.target.value;render()}});
document.addEventListener('submit',e=>{const f=e.target;if(f.dataset.form!=='ask')return;e.preventDefault();const v=f.q.value.trim();if(!v)return;f.q.value='';ask(v)});
document.addEventListener('input',e=>{const f=e.target.closest&&e.target.closest('form[data-form=ask]');if(f)f.querySelector('.send').disabled=!e.target.value.trim()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&el('ov').classList.contains('open'))closeDialog();
  if(e.key==='Tab'&&el('ov').classList.contains('open')){const f=[...el('dlg').querySelectorAll('button:not(:disabled),input:not(:disabled),textarea,select,[href]')];if(!f.length)return;const a=f[0],z=f[f.length-1];if(e.shiftKey&&document.activeElement===a){e.preventDefault();z.focus()}else if(!e.shiftKey&&document.activeElement===z){e.preventDefault();a.focus()}}
  if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&e.target.closest&&e.target.closest('#tabs')){const i=TABS.findIndex(x=>x[0]===S.tab),j=(i+(e.key==='ArrowRight'?1:-1)+TABS.length)%TABS.length;go(TABS[j][0]);setTimeout(()=>el('tabs').children[j].focus(),30)}
});
el('ov').addEventListener('click',e=>{if(e.target===el('ov'))closeDialog()});
addEventListener('hashchange',route);
setInterval(()=>{if(['normal','error','offline'].includes(S.mode)&&!el('ov').classList.contains('open')&&!document.querySelector('.ask input:focus'))render(false)},30000);

/* ================= Boot ================= */
let tuckT;function tuck(){clearTimeout(tuckT);tuckT=setTimeout(()=>{S.fabTip=false;renderFab()},10000)}
route();
setTimeout(()=>{S.mode='normal';render();tuck()},900);
